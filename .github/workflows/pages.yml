# Publishes GitHub Pages from an Actions artifact.
# The public Muse build is a demo. It does not inline a relay URL or a room.
# Visitors enter both at runtime. docs/muse/ on main is that same unconfigured
# demo build. The leak guard scans the artifact and the committed tree.
#
# Repository Settings → Pages → Build and deployment → Source must be
# "GitHub Actions". Until that switch, deploy-pages cannot publish and the
# live site stays on the legacy main /docs branch build.

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Do not cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/muse/package-lock.json

      - name: Install Muse dependencies
        working-directory: web/muse
        run: npm ci

      - name: Stage docs without the committed Muse build
        run: |
          site="${RUNNER_TEMP}/pages"
          rm -rf "$site"
          mkdir -p "$site"
          cp -a docs/. "$site/"
          rm -rf "$site/muse"

      - name: Build the public Muse demo
        working-directory: web/muse
        env:
          MUSE_BUILD_OUTDIR: ${{ runner.temp }}/pages/muse
          VITE_RELAY_URL: ""
          VITE_WATCH_CHANNEL: ""
          VITE_PUBLIC_DEMO_RELAY: ""
        run: |
          unset VITE_RELAY_URL VITE_WATCH_CHANNEL VITE_PUBLIC_DEMO_RELAY
          npm run build
          node ../../tools/check-public-leaks.mjs "${MUSE_BUILD_OUTDIR}" "${RUNNER_TEMP}/pages"

      - name: Confirm the checkout was not rewritten
        run: |
          if [ -n "$(git status --porcelain -- docs/muse)" ]; then
            echo "::error::The Muse build wrote into docs/muse. Refusing to keep a rewritten bundle in the checkout."
            git status --porcelain -- docs/muse
            exit 1
          fi
          test -f "${RUNNER_TEMP}/pages/index.html"
          test -f "${RUNNER_TEMP}/pages/.nojekyll"
          test -d "${RUNNER_TEMP}/pages/status"
          test -f "${RUNNER_TEMP}/pages/muse/index.html"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
